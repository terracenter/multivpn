{{define "route_rows"}}
{{range .Routes}}
<tr id="route-row-{{.ID}}">
  <td style="color: var(--muted); font-mono: true;">#{{.ID}}</td>
  <td>
    <span class="badge badge-neutral">{{.VPNName}}</span>
  </td>
  <td>
    <strong style="font-family: monospace; font-size: 0.95rem; color: #38bdf8;">{{.Route}}</strong>
  </td>
  <td>{{.Description}}</td>
  <td style="text-align: right; white-space: nowrap;">
    <button class="btn btn-secondary btn-sm"
            @click="openEditModal({{.ID}}, {{.VPNID}}, '{{.Route}}', '{{.Description}}')">
      ✏️ Editar
    </button>
    <button class="btn btn-danger btn-sm"
            hx-delete="/api/routes/{{.ID}}"
            hx-target="#route-row-{{.ID}}"
            hx-swap="outerHTML"
            hx-confirm="¿Seguro que deseas eliminar la ruta {{.Route}}?">
      🗑️
    </button>
  </td>
</tr>
{{else}}
<tr>
  <td colspan="5" style="text-align: center; color: var(--muted); padding: 2rem;">
    No se encontraron rutas que coincidan con la búsqueda.
  </td>
</tr>
{{end}}
{{end}}

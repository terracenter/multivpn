{{define "domain_rows"}}
{{range .Domains}}
<tr id="domain-row-{{.ID}}" class="hover:bg-slate-800/40 transition-colors border-b border-slate-800/60 text-xs">
  <td class="py-3.5 px-4 font-mono text-slate-500">
    #{{.ID}}
  </td>
  <td class="py-3.5 px-4">
    <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-medium bg-cyan-500/10 text-cyan-300 border border-cyan-500/20">
      <span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
      {{.VPNName}}
    </span>
  </td>
  <td class="py-3.5 px-4 font-mono font-semibold text-sm text-cyan-300">
    {{.Domain}}
  </td>
  <td class="py-3.5 px-4 text-slate-300">
    {{if .Description}}
      <span>{{.Description}}</span>
    {{else}}
      <span class="text-slate-600 italic">Sin descripción</span>
    {{end}}
  </td>
  <td class="py-3.5 px-4 text-right space-x-1 whitespace-nowrap">
    <button type="button"
            class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2.5 py-1 rounded-lg text-xs font-medium transition-colors inline-flex items-center gap-1.5"
            @click="openEditModal({{.ID}}, {{.VPNID}}, '{{.Domain}}', '{{.Description}}')">
      <svg class="w-3.5 h-3.5 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
      </svg>
      <span>Editar</span>
    </button>
    <button type="button"
            class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 px-2 py-1 rounded-lg text-xs font-medium transition-colors inline-flex items-center"
            hx-delete="/api/domains/{{.ID}}"
            hx-target="#domain-row-{{.ID}}"
            hx-swap="outerHTML"
            hx-confirm="¿Seguro que deseas eliminar el dominio {{.Domain}}?"
            title="Eliminar dominio">
      <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>
    </button>
  </td>
</tr>
{{else}}
<tr>
  <td colspan="5" class="text-center text-slate-500 py-12">
    <div class="flex flex-col items-center justify-center gap-2">
      <svg class="w-8 h-8 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span class="text-sm font-medium">No se encontraron dominios que coincidan con la búsqueda.</span>
    </div>
  </td>
</tr>
{{end}}
{{end}}
